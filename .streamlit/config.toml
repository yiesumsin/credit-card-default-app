# Base theme for the app: forest green, slate and white. (The extra styling lives in ui.py.)
[theme]
base = "light"
primaryColor = "#315D54"            # sliders, selected tabs, focus rings
backgroundColor = "#FFFFFF"         # main page
secondaryBackgroundColor = "#F5F6F4" # sidebar, widget backgrounds
textColor = "#242C29"
font = "sans serif"

[server]
maxUploadSize = 50                  # megabytes; plenty for a CSV of tens of thousands of clients

[browser]
gatherUsageStats = false

